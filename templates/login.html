<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · MTG Card Viewer</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">

  <main class="login-card">
    <div class="login-brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 1 31 16 16 31 1 16Z" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M16 8.5 23.5 16 16 23.5 8.5 16Z" fill="currentColor"/>
      </svg>
      <h1>MTG Card Viewer</h1>
    </div>

    {% if no_accounts %}
      <p class="login-note">
        No accounts exist yet. On the server, run
        <code>python manage.py adduser &lt;name&gt;</code> to make one.
      </p>
    {% else %}
      <form method="post" autocomplete="on">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <input type="hidden" name="next" value="{{ next_url }}">

        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username"
               autofocus required value="{{ username or '' }}">

        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" required>

        {% if error %}<p class="login-error">{{ error }}</p>{% endif %}

        <button class="btn primary block" type="submit">Sign in</button>
      </form>
    {% endif %}

    <p class="credit">Card data &amp; images from Scryfall</p>
  </main>

</body>
</html>
